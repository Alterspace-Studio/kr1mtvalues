<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KR1 Military Tycoon Values</title>
  <meta name="description" content="Military Tycoon vehicle values and performance.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 2 15 14H1z' fill='%23f5b800'/%3E%3C/svg%3E">
  <!-- 테마: 저장한 선택이 있으면 먼저 적용 (깜빡임 방지) -->
  <script>try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <script>document.write('<link rel="stylesheet" href="style.css?v=' + Date.now() + '">');</script>
  <noscript><link rel="stylesheet" href="style.css"></noscript>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"></span><span id="siteTitle">KR1 Military Tycoon Values</span><img class="flag" src="images/kr-flag.svg" alt="대한민국 국기" width="24" height="16"></div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-view="values" data-i18n="tabValues"></button>
      <button class="tab" data-view="compare" data-i18n="tabCompare"></button>
      <button class="tab" data-view="trade" data-i18n="tabTrade"></button>
      <button class="tab" data-view="changes" data-i18n="tabChanges"></button>
    </nav>
    <div class="updated"><span data-i18n="updated"></span> <span id="lastUpdated"></span></div>
    <button class="lang" id="langBtn" aria-label="Language"></button>
    <button class="theme-btn" id="themeBtn" aria-label="Theme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
  </header>

  <main>
    <!-- 가치 목록 -->
    <section id="view-values" class="view active">
      <div class="toolbar">
        <input id="search" type="search" data-i18n-ph="search" autocomplete="off">
        <div class="chips" id="categoryChips"></div>
        <select id="sort">
          <option value="value-desc" data-i18n="sortValueDesc"></option>
          <option value="value-asc" data-i18n="sortValueAsc"></option>
          <option value="demand-desc" data-i18n="sortDemand"></option>
          <option value="vfm-desc" data-i18n="sortVfm"></option>
          <option value="name-asc" data-i18n="sortName"></option>
        </select>
        <label class="check"><input type="checkbox" id="onlyTradeable"> <span data-i18n="onlyTradeable"></span></label>
        <label class="check"><input type="checkbox" id="onlyLimited"> <span data-i18n="onlyLimited"></span></label>
      </div>
      <p class="count" id="resultCount"></p>
      <div class="grid" id="grid"></div>
    </section>

    <!-- 성능 비교 -->
    <section id="view-compare" class="view">
      <div class="toolbar">
        <select class="cmp-pick" data-slot="0"></select>
        <select class="cmp-pick" data-slot="1"></select>
        <select class="cmp-pick" data-slot="2"></select>
      </div>
      <div id="compareTable"></div>
    </section>

    <!-- 거래 계산기 -->
    <section id="view-trade" class="view">
      <div class="trade">
        <div class="side" data-side="you">
          <h2 data-i18n="youGive"></h2>
          <div class="add"><input list="itemList" data-i18n-ph="addItem" class="trade-input"><button class="btn add-btn" data-i18n="add"></button></div>
          <ul class="trade-list"></ul>
          <div class="total"><span data-i18n="total"></span> <b class="sum">💎 0</b></div>
        </div>
        <div class="verdict" id="verdict"></div>
        <div class="side" data-side="them">
          <h2 data-i18n="youGet"></h2>
          <div class="add"><input list="itemList" data-i18n-ph="addItem" class="trade-input"><button class="btn add-btn" data-i18n="add"></button></div>
          <ul class="trade-list"></ul>
          <div class="total"><span data-i18n="total"></span> <b class="sum">💎 0</b></div>
        </div>
      </div>
      <datalist id="itemList"></datalist>
      <p class="hint" data-i18n="tradeHint"></p>
    </section>

    <!-- 변경 기록: 모든 아이템의 가치 변화 -->
    <section id="view-changes" class="view">
      <div class="toolbar"><input type="search" id="chSearch" data-i18n-ph="chSearch"></div>
      <p class="count" id="chCount"></p>
      <div class="table-wrap"><table class="changes"><thead><tr><th data-i18n="chDate"></th><th data-i18n="chItem"></th><th data-i18n="chFrom"></th><th data-i18n="chTo"></th><th data-i18n="chDiff"></th></tr></thead><tbody id="chBody"></tbody></table></div>
    </section>
  </main>

  <!-- 상세 창 -->
  <dialog id="detail"><div id="detailBody"></div></dialog>

  <footer class="foot" data-i18n="footer"></footer>

  <!-- 브라우저가 예전 파일을 쓰지 않도록 열 때마다 새로 받는다 -->
  <script>
    (function () {
      var v = Date.now();
      function load(src, next) { var s = document.createElement("script"); s.src = src + "?v=" + v; s.onload = next; document.body.appendChild(s); }
      load("data/items.js", function () { load("app.js"); });
    })();
  </script>
</body>
</html>
